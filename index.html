<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARASA77</title>
<style>
body{margin:0;font-family:Arial;background:#0a1931;color:#fff}
.header{background:#162447;padding:18px;text-align:center;border-bottom:4px solid #00d4ff}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:#fff;color:#111;padding:16px;border-radius:14px;margin-bottom:12px}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #999}
button{width:100%;padding:13px;border:none;border-radius:10px;margin:6px 0;font-weight:bold}
.btn{background:#0a1931;color:#fff}.blue{background:#00d4ff;color:#0a1931}.green{background:#00ff88;color:#0a1931}
.timer{font-size:36px;text-align:center;font-weight:900;color:#0a1931}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px;border:1px solid #ddd}
</style></head><body>
<div class="header">
<h1 style="margin:0;color:#00d4ff;letter-spacing:3px">DARASA77</h1>
<p style="margin:4px 0">SOUTH EASTERN KENYA UNIVERSITY</p>
</div>
<div class="container">
<div id="auth" class="card">
<h3 style="margin:0;color:#0a1931">SEKU Login</h3>
<select id="role"><option value="student">Student</option><option value="lecturer">Lecturer</option><option value="hod">HOD</option></select>
<input id="a_name" placeholder="Full Name"><input id="a_id" placeholder="Reg No / Staff ID"><input id="a_pass" type="password" placeholder="Password"><input id="a_dept" placeholder="Department">
<button class="blue" onclick="handleAuth()">Login</button>
<p id="msg" style="color:red;font-size:12px"></p>
</div>
<div id="studentDash" class="hidden">
<div class="card"><b id="s_name"></b> | <a href="#" onclick="logout()">Logout</a></div>
<div class="card"><select id="s_all_units"></select><button class="blue" onclick="enrollUnit()">Enroll Unit</button><div id="s_my_units" style="font-size:11px"></div><select id="s_unit"></select><input id="s_code" placeholder="Code"><button class="green" onclick="studentAttend()">MARK PRESENT</button><p id="s_msg"></p></div>
<div class="card"><div id="s_history" style="font-size:12px"></div></div>
</div>
<div id="lectDash" class="hidden">
<div class="card"><b id="l_name"></b> | <a href="#" onclick="logout()">Logout</a><div class="timer" id="timer">03:00:00</div></div>
<div class="card"><div style="display:flex;gap:6px"><input id="l_unitCode" placeholder="Unit Code"><input id="l_unitName" placeholder="Unit Name"></div><button class="blue" onclick="addUnit()">Save Unit</button></div>
<div class="card"><select id="l_units"></select><div style="display:flex;gap:6px"><select id="l_week"><option>Week 1</option><option>Week 2</option><option>Week 3</option><option>Week 4</option><option>Week 5</option><option>Week 6</option><option>Week 7</option><option>Week 8</option><option>Week 9</option><option>Week 10</option><option>Week 11</option><option>Week 12</option><option>Week 13</option><option>Week 14</option><option>Week 15</option></select><select id="l_lesson"><option>Lesson 1</option><option>Lesson 2</option><option>Lesson 3</option></select></div><button class="btn" onclick="genCode()">GENERATE CODE</button><h1 id="l_codeDisplay" style="text-align:center;color:#0a1931">CODE: ----</h1><p id="l_lessonInfo" style="text-align:center;font-size:12px"></p><button onclick="stopLect()" style="background:#ddd">STOP</button></div>
<div class="card"><table><thead><tr><th>Week</th><th>Lesson</th><th>Reg</th><th>Name</th><th>Time</th></tr></thead><tbody id="l_list"></tbody></table><button onclick="downloadList()" class="blue">Download CSV</button></div>
</div>
<div id="hodDash" class="hidden"><div class="card"><b id="h_name"></b> - HOD | <a href="#" onclick="logout()">Logout</a></div><div class="card"><table><thead><tr><th>Name</th><th>Reg</th><th>Unit</th><th>Week</th><th>Lesson</th><th>Time</th></tr></thead><tbody id="h_list"></tbody></table><button onclick="downloadList()" class="btn">Download</button><button onclick="clearAll()" style="background:red;color:white">Clear All</button></div></div>
</div>
<script>
let currentUser=null,interv=null,timeLeft=10800;
function handleAuth(){const r=document.getElementById('role').value,n=document.getElementById('a_name').value.trim(),id=document.getElementById('a_id').value.trim(),p=document.getElementById('a_pass').value.trim(),d=document.getElementById('a_dept').value.trim();if(!id||!p){document.getElementById('msg').innerText='Enter ID';return;}let u=JSON.parse(localStorage.getItem('d77_users')||'[]');let f=u.find(x=>x.id===id&&x.role===r);if(!f){if(!n||!d){document.getElementById('msg').innerText='First time: Name & Dept';return;}f={id,pass:p,role:r,name:n,dept:d};u.push(f);}else{if(f.pass!==p){document.getElementById('msg').innerText='Wrong pass';return;}}localStorage.setItem('d77_users',JSON.stringify(u));currentUser=f;localStorage.setItem('d77_cur',JSON.stringify(f));showDash(f);}
function showDash(u){document.getElementById('auth').classList.add('hidden');if(u.role==='student'){document.getElementById('studentDash').classList.remove('hidden');document.getElementById('s_name').innerText=u.name;loadStudentUnits();}else if(u.role==='lecturer'){document.getElementById('lectDash').classList.remove('hidden');document.getElementById('l_name').innerText=u.name;loadLectUnits();loadLectList();loadCode();}else{document.getElementById('hodDash').classList.remove('hidden');document.getElementById('h_name').innerText=u.name;loadHOD();}}
function addUnit(){const c=document.getElementById('l_unitCode').value.trim(),n=document.getElementById('l_unitName').value.trim();if(!c||!n)return alert('Enter');let units=JSON.parse(localStorage.getItem('d77_units')||'[]');units.push({code:c,name:n,lect:currentUser.id,lectName:currentUser.name});localStorage.setItem('d77_units',JSON.stringify(units));loadLectUnits();}
function loadLectUnits(){let units=JSON.parse(localStorage.getItem('d77_units')||'[]').filter(u=>u.lect===currentUser.id);let sel=document.getElementById('l_units');sel.innerHTML='';units.forEach(u=>{let o=document.createElement('option');o.value=u.code;o.textContent=u.code+' - '+u.name;sel.appendChild(o);});}
function loadStudentUnits(){let units=JSON.parse(localStorage.getItem('d77_units')||'[]');let allSel=document.getElementById('s_all_units');allSel.innerHTML='';units.forEach(u=>{let o=document.createElement('option');o.value=u.code;o.textContent=u.code+' - '+u.name;allSel.appendChild(o);});let enrolled=JSON.parse(localStorage.getItem('d77_enroll_'+currentUser.id)||'[]');document.getElementById('s_my_units').innerText=enrolled.length?'Enrolled: '+enrolled.join(', '):'';let sSel=document.getElementById('s_unit');sSel.innerHTML='';enrolled.forEach(code=>{let u=units.find(x=>x.code===code);if(u){let o=document.createElement('option');o.value=u.code;o.textContent=u.code+' - '+u.name;sSel.appendChild(o);}});let recs=JSON.parse(localStorage.getItem('d77_att')||'[]').filter(r=>r.reg===currentUser.id);document.getElementById('s_history').innerHTML=recs.map(r=>`<div><b>${r.unit}</b> ${r.week} ${r.lesson} ${r.time}</div>`).join('')||'No record';}
function enrollUnit(){const c=document.getElementById('s_all_units').value;let k='d77_enroll_'+currentUser.id;let a=JSON.parse(localStorage.getItem(k)||'[]');if(!a.includes(c)){a.push(c);localStorage.setItem(k,JSON.stringify(a));}loadStudentUnits();}
function genCode(){let unit=document.getElementById('l_units').value;if(!unit)return alert('Create unit');let w=document.getElementById('l_week').value,l=document.getElementById('l_lesson').value;let code=Math.floor(1000+Math.random()*9000).toString();let data={code,unit,lect:currentUser.id,lectName:currentUser.name,week:w,lesson:l};localStorage.setItem('d77_currentCode',JSON.stringify(data));document.getElementById('l_codeDisplay').innerText='CODE: '+code;document.getElementById('l_lessonInfo').innerText=unit+' - '+w+' '+l;startTimer();}
function loadCode(){let d=JSON.parse(localStorage.getItem('d77_currentCode')||'null');if(d){document.getElementById('l_codeDisplay').innerText='CODE: '+d.code;document.getElementById('l_lessonInfo').innerText=d.unit+' - '+d.week+' '+d.lesson;}}
function startTimer(){if(interv)clearInterval(interv);timeLeft=10800;interv=setInterval(()=>{timeLeft--;let h=Math.floor(timeLeft/3600),m=Math.floor((timeLeft%3600)/60),s=timeLeft%60;document.getElementById('timer').innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);}
function stopLect(){clearInterval(interv);localStorage.removeItem('d77_currentCode');document.getElementById('l_codeDisplay').innerText='CODE: ----';}
function studentAttend(){let code=document.getElementById('s_code').value.trim();let active=JSON.parse(localStorage.getItem('d77_currentCode')||'null');if(!active){document.getElementById('s_msg').innerText='No active lesson';return;}if(active.code!==code){document.getElementById('s_msg').innerText='Wrong Code';return;}let recs=JSON.parse(localStorage.getItem('d77_att')||'[]');if(recs.find(r=>r.reg===currentUser.id&&r.unit===active.unit&&r.week===active.week&&r.lesson===active.lesson)){document.getElementById('s_msg').innerText='Already marked';return;}let rec={name:currentUser.name,reg:currentUser.id,dept:currentUser.dept,time:new Date().toLocaleString(),timestamp:Date.now(),unit:active.unit,week:active.week,lesson:active.lesson,lect:active.lect,lectName:active.lectName};recs.push(rec);localStorage.setItem('d77_att',JSON.stringify(recs));document.getElementById('s_msg').innerText='Marked '+active.week+' '+active.lesson;loadStudentUnits();loadLectList();}
function loadLectList(){let recs=JSON.parse(localStorage.getItem('d77_att')||'[]');if(currentUser&&currentUser.role==='lecturer')recs=recs.filter(r=>r.lect===currentUser.id);document.getElementById('l_list').innerHTML=recs.map(r=>`<tr><td>${r.week}</td><td>${r.lesson}</td><td>${r.reg}</td><td>${r.name}</td><td>${r.time}</td></tr>`).join('');}
function loadHOD(){let recs=JSON.parse(localStorage.getItem('d77_att')||'[]');document.getElementById('h_list').innerHTML=recs.map(r=>`<tr><td>${r.name}</td><td>${r.reg}</td><td>${r.unit}</td><td>${r.week}</td><td>${r.lesson}</td><td>${r.time}</td></tr>`).join('');}
function downloadList(){let recs=JSON.parse(localStorage.getItem('d77_att')||'[]');let csv='Unit,Week,Lesson,Reg,Name,Time\n'+recs.map(r=>`"${r.unit}","${r.week}","${r.lesson}","${r.reg}","${r.name}","${r.time}"`).join('\n');let a=document.createElement('a');a.href='data:text/csv,[STRIPPED]
function clearAll(){if(confirm('Clear all?')){localStorage.clear();location.reload();}}
function logout(){localStorage.removeItem('d77_cur');location.reload();}
let cur=JSON.parse(localStorage.getItem('d77_cur')||'null');if(cur){currentUser=cur;showDash(cur);}
</script></body></html>
