<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARASA77 - SEKU</title>
<style>
body{margin:0;font-family:Arial;background:#0a1931;color:white}
.header{background:#162447;padding:15px;text-align:center}
.header h1{color:#00d4ff;margin:0}
.container{max-width:500px;margin:auto;padding:15px}
.card{background:white;color:#222;padding:20px;border-radius:15px;margin-bottom:15px}
input,select{width:95%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;background:#0a1931;color:white;border:none;border-radius:8px;margin:6px 0;font-weight:bold}
button.blue{background:#00d4ff;color:#0a1931}
.unit-item{background:#f0f4ff;padding:10px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between}
.timer{font-size:40px;text-align:center;color:#00d4ff;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">
<h1>DARASA77</h1>
<p>250M Lecture Control - SEKU</p>
</div>

<div class="container">

<!-- LOGIN / REGISTER -->
<div id="authPage" class="card">
<h3 id="authTitle">Lecturer Login</h3>
<input id="regName" placeholder="Full Name (for Register)">
<input id="loginId" placeholder="Staff ID / Email">
<input id="loginPass" type="password" placeholder="Password">
<button id="authBtn" onclick="handleAuth()">Login</button>
<p style="text-align:center;font-size:13px"><a href="#" onclick="toggleAuth()">Don't have account? Register here</a></p>
<p id="authMsg" style="color:red;font-size:12px"></p>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="hidden">
<div class="card">
<p>Welcome, <b id="userName"></b> | <a href="#" onclick="logout()">Logout</a></p>
<div class="timer" id="timerDisplay">03:00:00</div>
<p style="text-align:center">Lecture Duration - 3 Hours</p>
<button class="blue" onclick="startLecture()">START LECTURE</button>
<button onclick="stopLecture()">STOP LECTURE</button>
<p id="status" style="text-align:center;font-size:12px">Status: Idle - Within 250M Range Active</p>
</div>

<div class="card">
<h4>Add New Unit</h4>
<input id="unitCode" placeholder="Unit Code e.g. EEE 444">
<input id="unitName" placeholder="Unit Name e.g. Control Systems II">
<button class="blue" onclick="addUnit()">SAVE UNIT</button>
</div>

<div class="card">
<h4>Saved Units (<span id="unitCount">0</span>)</h4>
<div id="unitList"></div>
<p style="font-size:11px;color:gray">Units are saved permanently in this device/browser. Add all your semester units.</p>
</div>
</div>

</div>

<script>
let isRegister = false;
let lectureInterval=null;
let timeLeft=10800; // 3 hours = 10800 seconds

function toggleAuth(){
isRegister=!isRegister;
document.getElementById('authTitle').innerText=isRegister?'Register Lecturer':'Lecturer Login';
document.getElementById('authBtn').innerText=isRegister?'Register & Save':'Login';
document.getElementById('regName').style.display=isRegister?'block':'none';
}

function handleAuth(){
const name=document.getElementById('regName').value;
const id=document.getElementById('loginId').value;
const pass=document.getElementById('loginPass').value;
if(!id||!pass){document.getElementById('authMsg').innerText='Fill all fields';return;}
let users=JSON.parse(localStorage.getItem('darasa77_users')||'[]');
if(isRegister){
if(users.find(u=>u.id===id)){document.getElementById('authMsg').innerText='User already exists, login';return;}
users.push({id,pass,name:name||id});
localStorage.setItem('darasa77_users',JSON.stringify(users));
document.getElementById('authMsg').style.color='green';
document.getElementById('authMsg').innerText='Registered! Now Login';
toggleAuth();
}else{
let found=users.find(u=>u.id===id && u.pass===pass);
if(!found){document.getElementById('authMsg').innerText='Wrong ID/Password or Not Registered';return;}
localStorage.setItem('darasa77_current',JSON.stringify(found));
showDash(found);
}
}

function showDash(user){
document.getElementById('authPage').classList.add('hidden');
document.getElementById('dashPage').classList.remove('hidden');
document.getElementById('userName').innerText=user.name;
loadUnits();
}

function logout(){
localStorage.removeItem('darasa77_current');
location.reload();
}

function addUnit(){
const code=document.getElementById('unitCode').value;
const name=document.getElementById('unitName').value;
if(!code||!name)return alert('Enter code and name');
let units=JSON.parse(localStorage.getItem('darasa77_units')||'[]');
units.push({code,name,date:new Date().toLocaleDateString()});
localStorage.setItem('darasa77_units',JSON.stringify(units));
document.getElementById('unitCode').value='';document.getElementById('unitName').value='';
loadUnits();
}

function loadUnits(){
let units=JSON.parse(localStorage.getItem('darasa77_units')||'[]');
document.getElementById('unitCount').innerText=units.length;
let html='';
units.forEach((u,i)=>{
html+=`<div class="unit-item"><span><b>${u.code}</b> - ${u.name}</span><span style="color:red;cursor:pointer" onclick="delUnit(${i})">X</span></div>`;
});
document.getElementById('unitList').innerHTML=html||'No units saved yet';
}

function delUnit(i){
let units=JSON.parse(localStorage.getItem('darasa77_units')||'[]');
units.splice(i,1);
localStorage.setItem('darasa77_units',JSON.stringify(units));
loadUnits();
}

function startLecture(){
if(lectureInterval)return;
document.getElementById('status').innerText='Status: LECTURE ONGOING - Controlling 250M range...';
lectureInterval=setInterval(()=>{
timeLeft--;
let h=Math.floor(timeLeft/3600);let m=Math.floor((timeLeft%3600)/60);let s=timeLeft%60;
document.getElementById('timerDisplay').innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
if(timeLeft<=0){stopLecture();alert('3 Hours Lecture Ended!');}
},1000);
}

function stopLecture(){
clearInterval(lectureInterval);lectureInterval=null;
timeLeft=10800;document.getElementById('timerDisplay').innerText='03:00:00';
document.getElementById('status').innerText='Status: Idle';
}

// Auto login if already logged
let cur=localStorage.getItem('darasa77_current');
if(cur)showDash(JSON.parse(cur));
</script>
</body>
</html>
